<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload de Imagem</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        padding: 40px;
        max-width: 600px;
        width: 100%;
      }

      h1 {
        color: #333;
        margin-bottom: 30px;
        text-align: center;
        font-size: 28px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: 500;
      }

      input[type="file"],
      select {
        width: 100%;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.3s;
      }

      input[type="file"]:focus,
      select:focus {
        outline: none;
        border-color: #667eea;
      }

      button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
      }

      button:active {
        transform: translateY(0);
      }

      .image-preview {
        margin-top: 30px;
        text-align: center;
      }

      .image-preview img {
        max-width: 100%;
        max-height: 400px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        margin-top: 15px;
      }

      .image-url {
        margin-top: 15px;
        padding: 12px;
        background: #f5f5f5;
        border-radius: 8px;
        word-break: break-all;
        font-size: 12px;
        color: #666;
      }

      .success-message {
        margin-top: 20px;
        padding: 12px;
        background: #d4edda;
        color: #155724;
        border-radius: 8px;
        text-align: center;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Upload de Imagem</h1>

      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
          <label for="image_file">Selecione uma imagem:</label>
          <input
            type="file"
            id="image_file"
            name="image_file"
            accept="image/*"
            required
          />
        </div>

        <div class="form-group">
          <label for="image_type">Tipo de upload:</label>
          <select id="image_type" name="image_type">
            <option value="public">Público</option>
            <option value="private">Privado</option>
          </select>
        </div>

        <button type="submit">Enviar Imagem</button>
      </form>

      {% if image_url %}
      <div class="success-message">Imagem enviada com sucesso!</div>
      <div class="image-preview">
        <img src="{{ image_url }}" alt="Imagem enviada" />
        <div class="image-url"><strong>URL:</strong> {{ image_url }}</div>
      </div>
      {% endif %}
    </div>
  </body>
</html>
